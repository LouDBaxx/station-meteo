
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05090c">
<title>Station météo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#05090c;
  color:#e9f5f4;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  overflow:hidden;
}

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease-in-out;
}

.screen.active{
  opacity:1;
  pointer-events:auto;
}

/* HORLOGE RÉTRO */

.clock-screen{
  flex-direction:column;
  background:radial-gradient(ellipse at center,#14242a 0%,#05090c 75%);
}

.clock-label{
  color:#63858a;
  font-size:12px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:35px;
}

.clock-frame{
  border:1px solid #24434a;
  border-radius:14px;
  padding:35px 22px;
  width:100%;
  max-width:650px;
  text-align:center;
  background:rgba(8,20,24,.75);
  box-shadow:0 0 35px rgba(0,255,200,.06),
             inset 0 0 35px rgba(0,255,200,.03);
}

#clock{
  font-family:"Courier New",monospace;
  font-size:clamp(75px,21vw,145px);
  font-weight:bold;
  letter-spacing:-5px;
  color:#8fffe0;
  text-shadow:0 0 8px rgba(90,255,215,.8),
              0 0 25px rgba(90,255,215,.4);
  font-variant-numeric:tabular-nums;
}

#date{
  margin-top:25px;
  color:#8ba6a8;
  font-size:16px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.clock-footer{
  margin-top:55px;
  color:#456269;
  font-size:10px;
  letter-spacing:4px;
}

/* MÉTÉO */

.weather-screen{
  background:#101820;
  overflow-y:auto;
}

main{
  width:100%;
  max-width:650px;
  margin:auto;
}

header{
  text-align:center;
  margin-bottom:25px;
}

h1{
  font-size:15px;
  color:#91a2af;
  letter-spacing:4px;
  font-weight:500;
}

.weather-date{
  color:#71838e;
  font-size:13px;
}

h2{
  font-size:13px;
  color:#91a2af;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:500;
  margin:22px 0 12px;
}

.panel{
  background:#1b2934;
  border-radius:18px;
  padding:22px;
  margin-bottom:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.value{
  font-size:clamp(32px,8vw,48px);
  font-weight:300;
}

.unit{
  font-size:18px;
  color:#a8b5bf;
}

.label{
  font-size:13px;
  color:#a8b5bf;
  margin-bottom:12px;
}

#weatherDesc{
  font-size:18px;
  margin-bottom:12px;
}

#weatherIcon{
  font-size:38px;
  margin-bottom:8px;
}

#status{
  font-size:11px;
  color:#82939f;
  text-align:center;
  margin-top:18px;
}

@media(max-height:600px){
  .panel{padding:15px;margin-bottom:8px}
  h2{margin:12px 0 8px}
  header{margin-bottom:12px}
  .clock-footer{margin-top:25px}
}
</style>
</head>

<body>

<!-- HORLOGE -->

<section class="screen clock-screen active" id="clockScreen">
  <div class="clock-label">LOCAL TIME</div>

  <div class="clock-frame">
    <div id="clock">--:--</div>
    <div id="date">Chargement...</div>
  </div>

  <div class="clock-footer">STATION MÉTÉO · NORMANDIE</div>
</section>

<!-- MÉTÉO -->

<section class="screen weather-screen" id="weatherScreen">
<main>

<header>
  <h1>STATION MÉTÉO</h1>
  <div class="weather-date" id="weatherDate"></div>
</header>

<h2>À l'intérieur · Salon</h2>

<div class="grid">
  <section class="panel">
    <div class="label">Température</div>
    <span class="value" id="temp">--</span>
    <span class="unit">°C</span>
  </section>

  <section class="panel">
    <div class="label">Humidité relative</div>
    <span class="value" id="humidity">--</span>
    <span class="unit">%</span>
  </section>
</div>

<h2>À l'extérieur</h2>

<section class="panel">
  <div id="weatherIcon">🌤️</div>
  <div id="weatherDesc">Chargement de la météo...</div>

  <div class="value">
    <span id="outsideTemp">--</span>
    <span class="unit">°C</span>
  </div>

  <div class="label" id="weatherDetails">
    Conditions extérieures
  </div>
</section>

<div id="status">Station météo · Chargement</div>

</main>
</section>

<script>

/* HORLOGE */

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString("fr-FR",{
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("date").textContent=
    now.toLocaleDateString("fr-FR",{
      weekday:"long",
      day:"numeric",
      month:"long"
    });

  document.getElementById("weatherDate").textContent=
    now.toLocaleDateString("fr-FR",{
      weekday:"long",
      day:"numeric",
      month:"long"
    });
}

updateClock();
setInterval(updateClock,1000);


/* ALTERNANCE AUTOMATIQUE */

const clockScreen=document.getElementById("clockScreen");
const weatherScreen=document.getElementById("weatherScreen");

const SCREEN_DURATION=20*1000;
const CYCLE_DURATION=SCREEN_DURATION*2;

let cycleStart=Date.now();
let currentScreen="clock";

function updateScreens(){
  const elapsed=(Date.now()-cycleStart)%CYCLE_DURATION;

  const nextScreen=
    elapsed<SCREEN_DURATION ? "clock" : "weather";

  if(nextScreen!==currentScreen){
    currentScreen=nextScreen;

    clockScreen.classList.toggle(
      "active",currentScreen==="clock"
    );

    weatherScreen.classList.toggle(
      "active",currentScreen==="weather"
    );
  }
}

setInterval(updateScreens,500);


/* DONNÉES TADO° */

const params=new URLSearchParams(window.location.search);

function readNumber(value){
  if(value===null || value.trim()==="") return null;

  const normalized=value.trim().replace(",",".");
  const number=Number(normalized);

  return Number.isFinite(number) ? number : null;
}

const temp=readNumber(params.get("temp"));
const humidity=readNumber(params.get("humidite"));

if(temp!==null){
  document.getElementById("temp").textContent=
    temp.toFixed(1).replace(".",",");
}

if(humidity!==null && humidity>=0 && humidity<=100){
  document.getElementById("humidity").textContent=
    Math.round(humidity);
}


/* MÉTÉO EXTÉRIEURE */

const descriptions={
  0:["Ciel dégagé","☀️"],
  1:["Principalement dégagé","🌤️"],
  2:["Partiellement nuageux","⛅"],
  3:["Couvert","☁️"],
  45:["Brouillard","🌫️"],
  48:["Brouillard givrant","🌫️"],
  51:["Bruine légère","🌦️"],
  53:["Bruine","🌦️"],
  55:["Bruine forte","🌧️"],
  61:["Pluie faible","🌦️"],
  63:["Pluie modérée","🌧️"],
  65:["Pluie forte","🌧️"],
  71:["Neige faible","🌨️"],
  73:["Neige","🌨️"],
  75:["Neige forte","❄️"],
  80:["Averses faibles","🌦️"],
  81:["Averses","🌧️"],
  82:["Fortes averses","⛈️"],
  95:["Orage","⛈️"],
  96:["Orage et grêle","⛈️"],
  99:["Orage violent","⛈️"]
};

async function loadWeather(lat,lon){
  const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;

  try{
    const response=await fetch(url);

    if(!response.ok){
      throw new Error("Erreur météo");
    }

    const data=await response.json();
    const c=data.current;

    const info=
      descriptions[c.weather_code]||
      ["Conditions variables","🌤️"];

    document.getElementById("weatherIcon").textContent=info[1];
    document.getElementById("weatherDesc").textContent=info[0];

    document.getElementById("outsideTemp").textContent=
      Math.round(c.temperature_2m);

    document.getElementById("weatherDetails").textContent=
      `Ressenti ${Math.round(c.apparent_temperature)} °C · Humidité ${c.relative_humidity_2m} % · Vent ${Math.round(c.wind_speed_10m)} km/h`;

    document.getElementById("status").textContent=
      "Météo actualisée · "+
      new Date().toLocaleTimeString("fr-FR",{
        hour:"2-digit",
        minute:"2-digit"
      });

  }catch(e){
    document.getElementById("weatherDesc").textContent=
      "Météo momentanément indisponible";
  }
}


/* LOCALISATION ET ACTUALISATION */

function refreshWeather(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>loadWeather(p.coords.latitude,p.coords.longitude),
      ()=>loadWeather(49.08,-1.10),
      {timeout:8000}
    );
  }else{
    loadWeather(49.08,-1.10);
  }
}

refreshWeather();
setInterval(refreshWeather,30*60*1000);

</script>

</body>
</html>
