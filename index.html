
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Station météo</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
  color: #f4f6f8;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

body {
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}

/* ÉCRANS ET TRANSITION */

.screen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.5s ease;
  background: #101820;
}

.screen.active {
  opacity: 1;
  visibility: visible;
}

/* HORLOGE */

.clock-screen {
  justify-content: center;
  gap: 3vh;
  padding: 0 2vw;
}

#clock {
  width: 100%;
  white-space: nowrap;
  text-align: center;
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", Arial, sans-serif;
  font-size: min(34vw, 61vh);
  font-weight: 500;
  letter-spacing: -0.055em;
  line-height: 1;
  color: #ffffff;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 15px rgba(255,255,255,0.05);
}

.clock-separator {
  display: inline-block;
  margin: 0 0.12em;
  font-weight: 400;
  letter-spacing: 0;
}

.date {
  color: #8795a3;
  font-size: clamp(15px, 2.5vw, 23px);
  font-weight: 400;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ÉCRANS MÉTÉO */

.weather-screen {
  gap: 2vh;
  padding: 4vh 6vw;
}

.weather-title {
  color: #8c9aa8;
  font-size: clamp(15px, 2.4vw, 22px);
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.weather-main {
  font-size: clamp(90px, 19vw, 150px);
  font-weight: 300;
  letter-spacing: -0.06em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.weather-unit {
  font-size: 0.45em;
  vertical-align: top;
  margin-left: 5px;
  font-weight: 300;
}

.weather-icon {
  font-size: clamp(48px, 9vw, 76px);
  line-height: 1;
}

.weather-description {
  color: #c2cbd3;
  font-size: clamp(19px, 3.2vw, 28px);
  font-weight: 400;
}

.weather-details {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 5vw;
  margin-top: 2vh;
  color: #aebbc6;
  font-size: clamp(16px, 2.6vw, 23px);
}

.detail {
  display: flex;
  align-items: center;
  gap: 9px;
}

.detail strong {
  color: #f4f6f8;
  font-weight: 500;
}

.weather-date {
  margin-top: 2vh;
}

/* ÉCRAN INTÉRIEUR */

.indoor-values {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10vw;
  width: 100%;
}

.indoor-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2vh;
}

.indoor-label {
  color: #8c9aa8;
  font-size: clamp(15px, 2.5vw, 22px);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.indoor-value {
  font-size: clamp(70px, 14vw, 115px);
  font-weight: 400;
  letter-spacing: -0.055em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.indoor-unit {
  font-size: 0.42em;
  vertical-align: top;
  margin-left: 4px;
  font-weight: 300;
}

.indoor-date {
  margin-top: 4vh;
}

/* MODE PORTRAIT */

@media (orientation: portrait) {
  #clock {
    font-size: min(23vw, 25vh);
  }

  .indoor-values {
    flex-direction: column;
    gap: 5vh;
  }

  .weather-details {
    flex-direction: column;
    gap: 2vh;
  }

  .weather-screen {
    padding: 4vh 4vw;
  }
}
</style>
</head>

<body>

<!-- ÉCRAN 1 : HORLOGE -->

<section id="clockScreen" class="screen clock-screen active">
  <div id="clock">00<span class="clock-separator">:</span>00</div>
  <div id="date" class="date"></div>
</section>

<!-- ÉCRAN 2 : TEMPÉRATURE INTÉRIEURE -->

<section id="indoorScreen" class="screen weather-screen">
  <div class="weather-title">Ambiance intérieure</div>

  <div class="indoor-values">
    <div class="indoor-block">
      <div class="indoor-label">Température</div>
      <div class="indoor-value">
        <span id="temp">--</span><span class="indoor-unit">°C</span>
      </div>
    </div>

    <div class="indoor-block">
      <div class="indoor-label">Humidité</div>
      <div class="indoor-value">
        <span id="humidity">--</span><span class="indoor-unit">%</span>
      </div>
    </div>
  </div>

  <div id="indoorDate" class="date indoor-date"></div>
</section>

<!-- ÉCRAN 3 : MÉTÉO EXTÉRIEURE -->

<section id="outdoorScreen" class="screen weather-screen">
  <div class="weather-title">Météo extérieure</div>

  <div id="weatherIcon" class="weather-icon">🌤️</div>

  <div class="weather-main">
    <span id="outsideTemp">--</span><span class="weather-unit">°C</span>
  </div>

  <div id="weatherDesc" class="weather-description">
    Chargement de la météo…
  </div>

  <div class="weather-details">
    <div class="detail">
      <span>Ressenti</span>
      <strong id="feelsLike">--°</strong>
    </div>

    <div class="detail">
      <span>Humidité</span>
      <strong id="outsideHumidity">-- %</strong>
    </div>

    <div class="detail">
      <span>Vent</span>
      <strong id="wind">-- km/h</strong>
    </div>
  </div>

  <div id="outdoorDate" class="date weather-date"></div>
  <div id="status" style="font-size:12px;color:#657482;margin-top:8px;"></div>
</section>

<script>

/* CONFIGURATION */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyOFvPcB_zDX5uiR0lLCQ2DjzTFFi5l9hFCOTazwZRJRSyZkTOzqumUqNbjeCCD-o67fg/exec";

const LATITUDE = 49.08;
const LONGITUDE = -1.10;

const SCREEN_DURATION = 10000;
const WEATHER_REFRESH = 30 * 60 * 1000;
const INDOOR_REFRESH = 15000;


/* HORLOGE ET DATE */

function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  });

  const date = now.toLocaleDateString("fr-FR", {
    weekday: "long",
    day: "numeric",
    month: "long"
  }).toUpperCase();

  document.getElementById("clock").innerHTML =
    time.replace(":", '<span class="clock-separator">:</span>');

  document.getElementById("date").textContent = date;
  document.getElementById("indoorDate").textContent = date;
  document.getElementById("outdoorDate").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* ALTERNANCE DES TROIS ÉCRANS */

const screens = [
  document.getElementById("clockScreen"),
  document.getElementById("indoorScreen"),
  document.getElementById("outdoorScreen")
];

let currentScreen = 0;

function showNextScreen() {
  screens[currentScreen].classList.remove("active");
  currentScreen = (currentScreen + 1) % screens.length;
  screens[currentScreen].classList.add("active");
}

setInterval(showNextScreen, SCREEN_DURATION);


/* TEMPÉRATURE ET HUMIDITÉ TADO° */

function displayIndoorData(temp, humidity) {
  const temperature = Number(temp);
  const humidite = Number(humidity);

  if (temp !== null && temp !== "" && Number.isFinite(temperature)) {
    document.getElementById("temp").textContent =
      temperature.toFixed(1).replace(".", ",");
  }

  if (
    humidity !== null &&
    humidity !== "" &&
    Number.isFinite(humidite) &&
    humidite >= 0 &&
    humidite <= 100
  ) {
    document.getElementById("humidity").textContent =
      Math.round(humidite);
  }
}

// Lecture initiale des paramètres URL

const params = new URLSearchParams(window.location.search);

const initialTemp = params.get("temp");
const initialHumidity = params.get("humidite");

if (initialTemp !== null || initialHumidity !== null) {
  displayIndoorData(initialTemp, initialHumidity);
}

// Lecture périodique depuis Apps Script

function refreshIndoorReadings() {
  const callbackName = "tadoCallback_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data) {
    if (data) {
      displayIndoorData(data.temp, data.humidity);
    }

    delete window[callbackName];
    script.remove();
  };

  script.src =
    APPS_SCRIPT_URL +
    "?callback=" + callbackName +
    "&_=" + Date.now();

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

refreshIndoorReadings();
setInterval(refreshIndoorReadings, INDOOR_REFRESH);


/* MÉTÉO EXTÉRIEURE OPEN-METEO */

function weatherDescription(code) {
  const descriptions = {
    0: ["Ciel dégagé", "☀️"],
    1: ["Principalement dégagé", "🌤️"],
    2: ["Partiellement nuageux", "⛅"],
    3: ["Couvert", "☁️"],
    45: ["Brouillard", "🌫️"],
    48: ["Brouillard givrant", "🌫️"],
    51: ["Bruine légère", "🌦️"],
    53: ["Bruine modérée", "🌦️"],
    55: ["Bruine dense", "🌧️"],
    56: ["Bruine verglaçante", "🌧️"],
    57: ["Bruine verglaçante", "🌧️"],
    61: ["Pluie faible", "🌧️"],
    63: ["Pluie modérée", "🌧️"],
    65: ["Pluie forte", "🌧️"],
    66: ["Pluie verglaçante", "🌧️"],
    67: ["Pluie verglaçante", "🌧️"],
    71: ["Neige faible", "🌨️"],
    73: ["Neige modérée", "🌨️"],
    75: ["Neige forte", "❄️"],
    77: ["Grains de neige", "❄️"],
    80: ["Averses faibles", "🌦️"],
    81: ["Averses modérées", "🌧️"],
    82: ["Averses fortes", "⛈️"],
    85: ["Averses de neige", "🌨️"],
    86: ["Averses de neige fortes", "❄️"],
    95: ["Orage", "⛈️"],
    96: ["Orage et grêle", "⛈️"],
    99: ["Orage et forte grêle", "⛈️"]
  };

  return descriptions[code] || ["Conditions variables", "🌤️"];
}

function updateWeather() {
  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + LATITUDE +
    "&longitude=" + LONGITUDE +
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&timezone=Europe%2FParis";

  fetch(url)
    .then(response => {
      if (!response.ok) {
        throw new Error("Erreur météo");
      }
      return response.json();
    })
    .then(data => {
      const current = data.current;

      document.getElementById("outsideTemp").textContent =
        Math.round(current.temperature_2m);

      document.getElementById("feelsLike").textContent =
        Math.round(current.apparent_temperature) + "°";

      document.getElementById("outsideHumidity").textContent =
        Math.round(current.relative_humidity_2m) + " %";

      document.getElementById("wind").textContent =
        Math.round(current.wind_speed_10m) + " km/h";

      const description = weatherDescription(current.weather_code);

      document.getElementById("weatherDesc").textContent =
        description[0];

      document.getElementById("weatherIcon").textContent =
        description[1];

      document.getElementById("status").textContent =
        "Données actualisées";
    })
    .catch(error => {
      document.getElementById("status").textContent =
        "Météo momentanément indisponible";
    });
}

updateWeather();
setInterval(updateWeather, WEATHER_REFRESH);

</script>
</body>
</html>
