
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">

<title>Station météo</title>

<!-- Installation sur l'écran d'accueil iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Station météo">
<meta name="mobile-web-app-capable" content="yes">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", Arial, sans-serif;
}

body {
  position: fixed;
  inset: 0;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* --------------------------------------------------
   STRUCTURE GÉNÉRALE
-------------------------------------------------- */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.5s ease;
}

.screen.active {
  opacity: 1;
  visibility: visible;
}

/* --------------------------------------------------
   ÉCRAN HORLOGE
-------------------------------------------------- */

.clock-screen {
  gap: 20px;
}

#clock {
  width: 100%;
  white-space: nowrap;
  text-align: center;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: min(34vw, 61vh);
  font-weight: 300;
  letter-spacing: -0.035em;
  line-height: 1;
  color: #ffffff;
  font-variant-numeric: tabular-nums;
}

.clock-separator {
  display: inline-block;
  margin: 0 0.10em;
  font-weight: 300;
  letter-spacing: 0;
  color: #cbd2d9;
}

#date {
  font-size: clamp(16px, 3vw, 25px);
  font-weight: 300;
  letter-spacing: 0.08em;
  color: #aab5bf;
  text-transform: capitalize;
}

/* --------------------------------------------------
   ÉCRAN CLIMAT INTÉRIEUR
-------------------------------------------------- */

.weather-screen {
  gap: 24px;
  text-align: center;
}

.screen-title {
  font-size: clamp(17px, 3vw, 25px);
  font-weight: 300;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #aab5bf;
}

.main-value {
  font-size: min(25vw, 42vh);
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
}

.unit {
  font-size: 0.45em;
  vertical-align: top;
  margin-left: 0.08em;
  color: #cbd2d9;
}

.secondary-values {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(28px, 7vw, 75px);
  margin-top: 12px;
}

.value-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.value-number {
  font-size: clamp(25px, 5vw, 43px);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
}

.value-label {
  font-size: clamp(12px, 2vw, 16px);
  font-weight: 300;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8f9ca8;
}

.separator {
  width: 1px;
  height: 55px;
  background: rgba(255,255,255,0.18);
}

/* --------------------------------------------------
   NOUVEL ÉCRAN MÉTÉO PREMIUM
-------------------------------------------------- */

.outdoor-screen {
  padding: 26px 6%;
  background:
    radial-gradient(
      ellipse at 50% 42%,
      rgba(67, 91, 111, 0.22) 0%,
      rgba(16, 24, 32, 0) 65%
    ),
    #101820;
  gap: 0;
  justify-content: space-between;
}

.outdoor-heading {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.outdoor-title {
  font-size: clamp(12px, 1.8vw, 16px);
  font-weight: 400;
  letter-spacing: 0.24em;
  color: #8797a5;
  text-transform: uppercase;
}

.outdoor-location {
  font-size: clamp(11px, 1.6vw, 14px);
  font-weight: 300;
  letter-spacing: 0.12em;
  color: #667887;
  text-transform: uppercase;
}

.outdoor-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  flex: 1;
  min-height: 0;
  padding: 8px 0;
}

.outdoor-icon {
  font-size: clamp(36px, 7vh, 58px);
  line-height: 1;
  margin-bottom: 7px;
  filter: saturate(0.65);
}

.outdoor-temperature {
  font-size: min(25vw, 34vh);
  font-weight: 200;
  line-height: 0.95;
  letter-spacing: -0.065em;
  font-variant-numeric: tabular-nums;
  color: #f5f7f9;
}

.outdoor-temperature .degree {
  font-size: 0.48em;
  vertical-align: top;
  margin-left: 0.06em;
  color: #c4ced6;
  font-weight: 300;
}

.outdoor-description {
  margin-top: 10px;
  font-size: clamp(16px, 2.8vw, 23px);
  font-weight: 300;
  letter-spacing: 0.04em;
  color: #c1ccd5;
}

.outdoor-divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(183, 200, 214, 0.22),
    transparent
  );
  flex-shrink: 0;
}

.outdoor-bottom {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: center;
  padding-top: 16px;
  padding-bottom: 3px;
}

.outdoor-metric {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 0;
}

.outdoor-metric + .outdoor-metric {
  border-left: 1px solid rgba(183, 200, 214, 0.15);
}

.metric-value {
  font-size: clamp(23px, 5vw, 38px);
  font-weight: 300;
  line-height: 1;
  color: #e8edf1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.metric-unit {
  font-size: 0.55em;
  color: #9eacb8;
  margin-left: 2px;
}

.metric-label {
  font-size: clamp(10px, 1.7vw, 13px);
  font-weight: 400;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: #8494a2;
}

#status {
  display: none;
}

/* --------------------------------------------------
   ADAPTATION PORTRAIT
-------------------------------------------------- */

@media (orientation: portrait) {
  #clock {
    font-size: min(25vw, 28vh);
  }

  .main-value {
    font-size: min(35vw, 30vh);
  }

  .weather-screen {
    gap: 18px;
  }

  .secondary-values {
    gap: 22px;
  }

  .outdoor-screen {
    padding: 30px 5%;
  }

  .outdoor-temperature {
    font-size: min(38vw, 25vh);
  }

  .outdoor-center {
    gap: 5px;
  }

  .outdoor-bottom {
    padding-top: 18px;
  }

  .metric-value {
    font-size: clamp(25px, 7vw, 36px);
  }
}
</style>
</head>

<body>

<!-- --------------------------------------------------
     ÉCRAN 1 : HORLOGE
-------------------------------------------------- -->

<section id="clockScreen" class="screen clock-screen active">
  <div id="clock"></div>
  <div id="date"></div>
</section>

<!-- --------------------------------------------------
     ÉCRAN 2 : CLIMAT INTÉRIEUR
-------------------------------------------------- -->

<section id="indoorScreen" class="screen weather-screen">

  <div class="screen-title">Température intérieure</div>

  <div class="main-value">
    <span id="temp">--</span><span class="unit">°</span>
  </div>

  <div class="secondary-values">
    <div class="value-item">
      <div class="value-number">
        <span id="humidity">--</span><span class="unit">%</span>
      </div>
      <div class="value-label">Humidité</div>
    </div>
  </div>

</section>

<!-- --------------------------------------------------
     ÉCRAN 3 : MÉTÉO EXTÉRIEURE PREMIUM
-------------------------------------------------- -->

<section id="outdoorScreen" class="screen outdoor-screen">

  <div class="outdoor-heading">
    <div class="outdoor-title">Météo extérieure</div>
    <div class="outdoor-location">Normandie</div>
  </div>

  <div class="outdoor-center">

    <div id="weatherIcon" class="outdoor-icon">🌤️</div>

    <div class="outdoor-temperature">
      <span id="outsideTemp">--</span><span class="degree">°</span>
    </div>

    <div id="weatherDesc" class="outdoor-description">
      Chargement...
    </div>

  </div>

  <div class="outdoor-divider"></div>

  <div class="outdoor-bottom">

    <div class="outdoor-metric">
      <div class="metric-value">
        <span id="feelsLike">--</span><span class="metric-unit">°</span>
      </div>
      <div class="metric-label">Ressenti</div>
    </div>

    <div class="outdoor-metric">
      <div class="metric-value">
        <span id="outsideHumidity">--</span><span class="metric-unit">%</span>
      </div>
      <div class="metric-label">Humidité</div>
    </div>

    <div class="outdoor-metric">
      <div class="metric-value">
        <span id="wind">--</span>
      </div>
      <div class="metric-label">Vent km/h</div>
    </div>

  </div>

  <div id="status"></div>

</section>


<script>

/* --------------------------------------------------
   PARAMÈTRES GÉNÉRAUX
-------------------------------------------------- */

const SCREEN_DURATION = 10000;
const INDOOR_REFRESH = 15000;
const WEATHER_REFRESH = 1800000;

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyOFvPcB_zDX5uiR0lLCQ2DjzTFFi5l9hFCOTazwZRJRSyZkTOzqumUqNbjeCCD-o67fg/exec";

const LATITUDE = 49.08;
const LONGITUDE = -1.10;


/* --------------------------------------------------
   HORLOGE
-------------------------------------------------- */

function updateClock() {
  const now = new Date();

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("clock").innerHTML =
    hours + '<span class="clock-separator">:</span>' + minutes;

  const date = now.toLocaleDateString("fr-FR", {
    weekday: "long",
    day: "numeric",
    month: "long"
  });

  document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* --------------------------------------------------
   ALTERNANCE DES TROIS ÉCRANS
-------------------------------------------------- */

const screens = [
  document.getElementById("clockScreen"),
  document.getElementById("indoorScreen"),
  document.getElementById("outdoorScreen")
];

let currentScreen = 0;

function showNextScreen() {
  screens[currentScreen].classList.remove("active");

  currentScreen = (currentScreen + 1) % screens.length;

  screens[currentScreen].classList.add("active");
}

setInterval(showNextScreen, SCREEN_DURATION);


/* --------------------------------------------------
   TEMPÉRATURE ET HUMIDITÉ INTÉRIEURES
-------------------------------------------------- */

function displayIndoorData(temp, humidity) {

  if (temp !== undefined && temp !== null && temp !== "") {
    document.getElementById("temp").textContent =
      Number(temp).toFixed(1).replace(".", ",");
  }

  if (humidity !== undefined && humidity !== null && humidity !== "") {
    document.getElementById("humidity").textContent =
      Math.round(Number(humidity));
  }
}

function refreshIndoorReadings() {

  const callbackName = "tadoCallback_" + Date.now();
  const script = document.createElement("script");

  window[callbackName] = function(data) {

    if (data) {
      displayIndoorData(data.temp, data.humidity);
    }

    delete window[callbackName];
    script.remove();
  };

  script.src =
    APPS_SCRIPT_URL +
    "?callback=" + callbackName +
    "&_=" + Date.now();

  script.onerror = function() {
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

refreshIndoorReadings();
setInterval(refreshIndoorReadings, INDOOR_REFRESH);


/* --------------------------------------------------
   MÉTÉO EXTÉRIEURE : OPEN-METEO
-------------------------------------------------- */

function getWeatherDescription(code) {

  const descriptions = {
    0: ["Ciel dégagé", "☀️"],
    1: ["Principalement dégagé", "🌤️"],
    2: ["Partiellement nuageux", "⛅"],
    3: ["Couvert", "☁️"],
    45: ["Brouillard", "🌫️"],
    48: ["Brouillard givrant", "🌫️"],
    51: ["Bruine légère", "🌦️"],
    53: ["Bruine modérée", "🌦️"],
    55: ["Bruine dense", "🌧️"],
    61: ["Pluie faible", "🌧️"],
    63: ["Pluie modérée", "🌧️"],
    65: ["Pluie forte", "🌧️"],
    71: ["Neige faible", "🌨️"],
    73: ["Neige modérée", "🌨️"],
    75: ["Neige forte", "❄️"],
    80: ["Averses faibles", "🌦️"],
    81: ["Averses modérées", "🌧️"],
    82: ["Averses violentes", "🌧️"],
    95: ["Orage", "⛈️"],
    96: ["Orage et grêle", "⛈️"],
    99: ["Orage et forte grêle", "⛈️"]
  };

  return descriptions[code] || ["Conditions variables", "🌤️"];
}


async function refreshWeather() {

  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + LATITUDE +
    "&longitude=" + LONGITUDE +
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&wind_speed_unit=kmh" +
    "&timezone=Europe%2FParis";

  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Erreur météo");
    }

    const data = await response.json();
    const current = data.current;

    document.getElementById("outsideTemp").textContent =
      Math.round(current.temperature_2m);

    document.getElementById("feelsLike").textContent =
      Math.round(current.apparent_temperature);

    document.getElementById("outsideHumidity").textContent =
      Math.round(current.relative_humidity_2m);

    document.getElementById("wind").textContent =
      Math.round(current.wind_speed_10m);

    const weather = getWeatherDescription(current.weather_code);

    document.getElementById("weatherDesc").textContent =
      weather[0];

    document.getElementById("weatherIcon").textContent =
      weather[1];

    document.getElementById("status").textContent =
      "Mis à jour à " +
      new Date().toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {

    document.getElementById("status").textContent =
      "Météo momentanément indisponible";

  }
}

refreshWeather();
setInterval(refreshWeather, WEATHER_REFRESH);

</script>

</body>
</html>
