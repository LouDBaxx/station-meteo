
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05090c">
<title>Station météo</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#05090c;
  color:#e9f5f4;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* GESTION DES ÉCRANS */

.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(12px,3vw,28px);
  opacity:0;
  pointer-events:none;
  transition:opacity 1.5s ease-in-out;
}

.screen.active{
  opacity:1;
  pointer-events:auto;
}

/* HORLOGE LCD */

.clock-screen{
  flex-direction:column;
  background:radial-gradient(ellipse at center,#14191e 0%,#05090c 75%);
}

.clock-label{
  color:#777f86;
  font-size:clamp(9px,1.7vw,12px);
  letter-spacing:5px;
  text-transform:uppercase;
  margin-bottom:clamp(12px,3vh,30px);
}

.clock-frame{
  border:1px solid #30383e;
  border-radius:14px;
  padding:clamp(15px,4vh,35px) 22px;
  width:100%;
  max-width:850px;
  text-align:center;
  background:rgba(12,15,19,.85);
  box-shadow:
    0 0 30px rgba(255,255,255,.015),
    inset 0 0 30px rgba(255,255,255,.015);
}

/* AFFICHAGE 7 SEGMENTS */

#clock{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.09em;
  height:1.15em;
  font-size:clamp(65px,18vw,145px);
  color:#e8edf0;
}

.digit{
  position:relative;
  width:.62em;
  height:1em;
  flex-shrink:0;
}

.seg{
  position:absolute;
  background:#e8edf0;
  opacity:.09;
  border-radius:3px;
  transition:opacity .15s;
}

.seg.on{
  opacity:1;
  box-shadow:0 0 2px rgba(255,255,255,.35);
}

.seg.a,.seg.d,.seg.g{
  width:60%;
  height:7%;
  left:20%;
}

.seg.a{top:0}
.seg.g{top:46.5%}
.seg.d{bottom:0}

.seg.b,.seg.c,.seg.e,.seg.f{
  width:8%;
  height:35%;
}

.seg.b{right:10%;top:7%}
.seg.c{right:10%;bottom:7%}
.seg.e{left:10%;bottom:7%}
.seg.f{left:10%;top:7%}

.colon{
  position:relative;
  width:.16em;
  height:1em;
  flex-shrink:0;
}

.colon::before,.colon::after{
  content:"";
  position:absolute;
  left:20%;
  width:55%;
  height:7%;
  background:#e8edf0;
  border-radius:50%;
  box-shadow:0 0 2px rgba(255,255,255,.3);
}

.colon::before{top:30%}
.colon::after{top:63%}

#date{
  margin-top:clamp(12px,3vh,25px);
  color:#929ba2;
  font-size:clamp(12px,2.5vw,16px);
  letter-spacing:3px;
  text-transform:uppercase;
}

.clock-footer{
  margin-top:clamp(15px,4vh,40px);
  color:#626c74;
  font-size:10px;
  letter-spacing:4px;
}

/* HABILLAGE COMMUN DES ÉCRANS MÉTÉO */

.weather-screen{
  background:#101820;
}

.dashboard{
  width:100%;
  max-width:900px;
  margin:auto;
}

header{
  text-align:center;
  margin-bottom:clamp(15px,3vh,30px);
}

h1{
  font-size:clamp(12px,2vw,16px);
  color:#91a2af;
  letter-spacing:4px;
  font-weight:500;
  margin:0 0 8px;
}

.weather-date{
  color:#71838e;
  font-size:clamp(11px,1.8vw,14px);
}

.subtitle{
  color:#71838e;
  font-size:11px;
  letter-spacing:4px;
  margin-top:10px;
}

/* CLIMAT INTÉRIEUR */

.climate-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(12px,3vw,24px);
  margin-top:25px;
}

.climate-panel{
  background:#1b2934;
  border:1px solid #293946;
  border-radius:18px;
  padding:clamp(18px,4vw,35px);
  text-align:center;
}

.label{
  font-size:clamp(11px,1.8vw,14px);
  color:#a8b5bf;
  letter-spacing:1px;
}

.value{
  font-size:clamp(38px,9vw,76px);
  font-weight:300;
  margin-top:12px;
}

.unit{
  font-size:clamp(16px,3vw,25px);
  color:#a8b5bf;
  font-weight:300;
}

/* MÉTÉO EXTÉRIEURE */

.outdoor-panel{
  background:#1b2934;
  border:1px solid #293946;
  border-radius:18px;
  padding:clamp(18px,4vw,32px);
  text-align:center;
  margin-top:15px;
}

#weatherIcon{
  font-size:clamp(35px,7vw,60px);
  margin-bottom:10px;
}

#weatherDesc{
  font-size:clamp(17px,3vw,25px);
  margin-bottom:8px;
}

.outdoor-panel .value{
  font-size:clamp(45px,10vw,82px);
}

#weatherDetails{
  margin-top:15px;
  line-height:1.6;
}

#status{
  position:absolute;
  bottom:15px;
  left:0;
  width:100%;
  font-size:10px;
  color:#82939f;
  text-align:center;
}

/* FORMAT PAYSAGE */

@media (orientation:landscape){

  .clock-frame{
    padding:15px 22px;
  }

  #clock{
    font-size:clamp(65px,18vh,125px);
  }

  .clock-label{
    margin-bottom:12px;
  }

  #date{
    margin-top:12px;
  }

  .clock-footer{
    margin-top:15px;
  }

  .climate-grid{
    margin-top:15px;
  }

  .climate-panel{
    padding:clamp(15px,3vh,25px);
  }

  .outdoor-panel{
    margin-top:10px;
    padding:15px;
  }

  .weather-screen header{
    margin-bottom:12px;
  }

  .outdoor-panel .value{
    margin-top:5px;
  }

  #weatherDetails{
    margin-top:8px;
  }
}

/* FORMAT PORTRAIT */

@media (orientation:portrait){

  .climate-grid{
    grid-template-columns:1fr;
    gap:12px;
  }

  .climate-panel{
    padding:20px;
  }
}
</style>
</head>

<body>

<!-- ÉCRAN 1 : HORLOGE -->

<section class="screen clock-screen active" id="clockScreen">

  <div class="clock-label">LOCAL TIME</div>

  <div class="clock-frame">
    <div id="clock">--:--</div>
    <div id="date">Chargement...</div>
  </div>

  <div class="clock-footer">
    STATION MÉTÉO · NORMANDIE
  </div>

</section>


<!-- ÉCRAN 2 : CLIMAT INTÉRIEUR -->

<section class="screen weather-screen" id="indoorScreen">

  <main class="dashboard">

    <header>
      <h1>CLIMAT INTÉRIEUR</h1>
      <div class="weather-date" id="indoorDate"></div>
      <div class="subtitle">SALON</div>
    </header>

    <div class="climate-grid">

      <div class="climate-panel">
        <div class="label">TEMPÉRATURE</div>
        <div class="value">
          <span id="temp">--</span><span class="unit"> °C</span>
        </div>
      </div>

      <div class="climate-panel">
        <div class="label">HUMIDITÉ RELATIVE</div>
        <div class="value">
          <span id="humidity">--</span><span class="unit"> %</span>
        </div>
      </div>

    </div>

  </main>

</section>


<!-- ÉCRAN 3 : MÉTÉO EXTÉRIEURE -->

<section class="screen weather-screen" id="outdoorScreen">

  <main class="dashboard">

    <header>
      <h1>MÉTÉO EXTÉRIEURE</h1>
      <div class="weather-date" id="outdoorDate"></div>
      <div class="subtitle">NORMANDIE</div>
    </header>

    <div class="outdoor-panel">

      <div id="weatherIcon">🌤️</div>

      <div id="weatherDesc">
        Chargement de la météo...
      </div>

      <div class="value">
        <span id="outsideTemp">--</span>
        <span class="unit"> °C</span>
      </div>

      <div class="label" id="weatherDetails">
        Conditions extérieures
      </div>

    </div>

  </main>

  <div id="status">
    Station météo · Chargement
  </div>

</section>


<script>

/* HORLOGE LCD À 7 SEGMENTS */

const digitSegments={
  "0":"abcdef",
  "1":"bc",
  "2":"abdeg",
  "3":"abcdg",
  "4":"bcfg",
  "5":"acdfg",
  "6":"acdefg",
  "7":"abc",
  "8":"abcdefg",
  "9":"abcdfg"
};

function renderClock(time){

  const clock=document.getElementById("clock");
  clock.innerHTML="";

  for(const char of time){

    if(char===":"){

      const colon=document.createElement("div");
      colon.className="colon";
      clock.appendChild(colon);
      continue;

    }

    const digit=document.createElement("div");
    digit.className="digit";

    for(const segment of "abcdefg"){

      const el=document.createElement("div");
      el.className="seg";

      if(digitSegments[char].includes(segment)){
        el.classList.add("on");
      }

      el.classList.add(segment);
      digit.appendChild(el);

    }

    clock.appendChild(digit);

  }

}

function updateClock(){

  const now=new Date();

  const time=now.toLocaleTimeString("fr-FR",{
    hour:"2-digit",
    minute:"2-digit"
  });

  renderClock(time);

  const date=now.toLocaleDateString("fr-FR",{
    weekday:"long",
    day:"numeric",
    month:"long"
  });

  document.getElementById("date").textContent=date;
  document.getElementById("indoorDate").textContent=date;
  document.getElementById("outdoorDate").textContent=date;

}

updateClock();
setInterval(updateClock,1000);


/* ALTERNANCE DES TROIS ÉCRANS */

const screens=[
  document.getElementById("clockScreen"),
  document.getElementById("indoorScreen"),
  document.getElementById("outdoorScreen")
];

const SCREEN_DURATION=5000;

let currentScreen=0;

function showScreen(index){

  screens.forEach((screen,i)=>{
    screen.classList.toggle("active",i===index);
  });

}

showScreen(0);

setInterval(()=>{

  currentScreen=(currentScreen+1)%screens.length;
  showScreen(currentScreen);

},SCREEN_DURATION);


/* DONNÉES TADO° */

const params=new URLSearchParams(window.location.search);

function readNumber(value){

  if(value===null || value.trim()==="") return null;

  const number=Number(value.trim().replace(",","."));

  return Number.isFinite(number)?number:null;

}

const temp=readNumber(params.get("temp"));
const humidity=readNumber(params.get("humidite"));

if(temp!==null){

  document.getElementById("temp").textContent=
    temp.toFixed(1).replace(".",",");

}

if(humidity!==null && humidity>=0 && humidity<=100){

  document.getElementById("humidity").textContent=
    Math.round(humidity);

}


/* MÉTÉO EXTÉRIEURE */

const descriptions={

  0:["Ciel dégagé","☀️"],
  1:["Principalement dégagé","🌤️"],
  2:["Partiellement nuageux","⛅"],
  3:["Couvert","☁️"],
  45:["Brouillard","🌫️"],
  48:["Brouillard givrant","🌫️"],
  51:["Bruine légère","🌦️"],
  53:["Bruine","🌦️"],
  55:["Bruine forte","🌧️"],
  61:["Pluie faible","🌦️"],
  63:["Pluie modérée","🌧️"],
  65:["Pluie forte","🌧️"],
  71:["Neige faible","🌨️"],
  73:["Neige","🌨️"],
  75:["Neige forte","❄️"],
  80:["Averses faibles","🌦️"],
  81:["Averses","🌧️"],
  82:["Fortes averses","⛈️"],
  95:["Orage","⛈️"],
  96:["Orage et grêle","⛈️"],
  99:["Orage violent","⛈️"]

};

async function loadWeather(lat,lon){

  const url=
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;

  try{

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("Erreur météo");
    }

    const data=await response.json();
    const c=data.current;

    const info=
      descriptions[c.weather_code]||
      ["Conditions variables","🌤️"];

    document.getElementById("weatherIcon").textContent=info[1];

    document.getElementById("weatherDesc").textContent=info[0];

    document.getElementById("outsideTemp").textContent=
      Math.round(c.temperature_2m);

    document.getElementById("weatherDetails").textContent=
      `Ressenti ${Math.round(c.apparent_temperature)} °C · Humidité ${c.relative_humidity_2m} % · Vent ${Math.round(c.wind_speed_10m)} km/h`;

    document.getElementById("status").textContent=
      "Météo actualisée · "+
      new Date().toLocaleTimeString("fr-FR",{
        hour:"2-digit",
        minute:"2-digit"
      });

  }catch(e){

    document.getElementById("weatherDesc").textContent=
      "Météo momentanément indisponible";

  }

}


/* LOCALISATION ET ACTUALISATION */

function refreshWeather(){

  if(navigator.geolocation){

    navigator.geolocation.getCurrentPosition(

      p=>loadWeather(
        p.coords.latitude,
        p.coords.longitude
      ),

      ()=>loadWeather(49.08,-1.10),

      {timeout:8000}

    );

  }else{

    loadWeather(49.08,-1.10);

  }

}

refreshWeather();
setInterval(refreshWeather,30*60*1000);

</script>

</body>
</html>
